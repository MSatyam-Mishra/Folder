name: Desktop apps

# Builds and packages the Windows and Linux apps for every app release (tags
# v*) and attaches them to the GitHub release, next to the APKs:
#   Windows: setup .exe, .msix, .msixbundle (+ the MSIX certificate)
#   Linux:   .tar.gz, .tar.xz, .deb, .rpm, .AppImage, .flatpak, .snap
# Each package is installed and checked before anything is uploaded.
# Run it by hand to build for an existing release, or to try the packaging
# without uploading.
#
# Secrets: MSIX_CERTIFICATE (base64 .pfx) and MSIX_CERTIFICATE_PASSWORD sign
# the MSIX files; packaging/windows/folder-msix.cer is its public part.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.6
        required: true
      ref:
        description: Code to build, if not the tag (branch, tag or commit)
        required: false
        default: ''
      upload:
        description: Upload the packages to the release
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  REF: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
  FLUTTER_VERSION: 3.44.1

jobs:
  windows:
    # App releases only, not the video engine's.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      # Packaging files come from this workflow's commit, so older tags can be
      # packaged too.
      - uses: actions/checkout@v4
        with:
          path: .packaging
          sparse-checkout: packaging

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
        env:
          # Visual Studio 2026 rejects the <experimental/coroutine> header that
          # flutter_inappwebview_windows still uses, unless this is defined.
          # MSVC reads extra options from CL.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Install Inno Setup
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }

      - name: Make the installer and MSIX packages
        env:
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'msix.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERTIFICATE))
          try {
            ./.packaging/packaging/windows/make-packages.ps1 -Version $env:TAG.TrimStart('v') `
              -RepoDir . -OutDir dist -CertificatePath $pfx -CertificatePassword $env:MSIX_CERTIFICATE_PASSWORD
          } finally {
            Remove-Item $pfx
          }

      - name: Check that the packages install
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Folder"
          if (-not (Test-Path "$dir\folder.exe")) { throw 'The installer did not install folder.exe' }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait

          Import-Certificate -FilePath (Get-ChildItem dist/*.cer).FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          foreach ($package in Get-ChildItem dist/*.msix, dist/*.msixbundle) {
            Add-AppxPackage -Path $package.FullName
            $installed = Get-AppxPackage MSatyamMishra.Folder
            if (-not $installed) { throw "$($package.Name) did not install" }
            Write-Output "$($package.Name): installed $($installed.PackageFullName)"
            Remove-AppxPackage $installed.PackageFullName
          }

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: dist/*
          if-no-files-found: error

  linux-build:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    # rive_native's prebuilt library needs glibc 2.38 and libstdc++ 13,
    # so the app needs Ubuntu 24.04 or a distro as recent anyway.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - name: Install Linux build tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev patchelf tesseract-ocr tesseract-ocr-eng
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      # flutter build only prints the last line of a native build error.
      - name: Show the native build error
        if: failure()
        run: ninja -C build/linux/x64/release 2>&1 | tail -80
      # The AppImage, the Flatpak and the archives carry libmpv (video and
      # audio) and the libraries it needs that a desktop may lack, next to
      # the app's own; the .deb, .rpm and snap use the system's libmpv.
      - name: Make the portable bundle
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy --appdir mpv.AppDir \
            --library "$(find /usr/lib -name 'libmpv.so.2' | head -1)"
          # What every desktop has (and must match its GTK, drivers and
          # sound server) comes from the system.
          (cd mpv.AppDir/usr/lib && while read -r pattern; do
             case "$pattern" in ''|'#'*) continue ;; esac
             rm -f $pattern
           done < "$GITHUB_WORKSPACE/packaging/linux/system-libs.txt")
          cp -a build/linux/x64/release/bundle portable
          cp -a mpv.AppDir/usr/lib/. portable/lib/
          # linuxdeploy also leaves out what AppImages assume every system
          # has (libjack...): add whatever else a binary needs, except what's
          # on the system list and glibc and the C++ runtime.
          add_libraries() {
            ldd "$1" | awk '/=> \//{print $3}' | while read -r lib; do
              name=$(basename "$lib")
              [ -e "portable/lib/$name" ] && continue
              case "$name" in
                libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*|libstdc++.so*|libgcc_s.so*|libresolv.so*|libutil.so*) continue ;;
              esac
              skip=
              while read -r pattern; do
                case "$pattern" in ''|'#'*) continue ;; esac
                case "$name" in $pattern) skip=1; break ;; esac
              done < "$GITHUB_WORKSPACE/packaging/linux/system-libs.txt"
              [ -n "$skip" ] && continue
              cp -L "$lib" "portable/lib/$name"
              patchelf --set-rpath '$ORIGIN' "portable/lib/$name"
              echo "added $name"
            done
          }
          add_libraries "$(find /usr/lib -name 'libmpv.so.2' | head -1)"
          # Tesseract and its English data, for text in images.
          mkdir -p portable/tesseract/tessdata
          cp -L /usr/bin/tesseract portable/tesseract/tesseract
          patchelf --set-rpath '$ORIGIN/../lib' portable/tesseract/tesseract
          cp /usr/share/tesseract-ocr/5/tessdata/eng.traineddata portable/tesseract/tessdata/
          add_libraries /usr/bin/tesseract
          # Plugins link libmpv; let them find it next to them.
          for plugin in portable/lib/*_plugin.so; do
            patchelf --set-rpath '$ORIGIN' "$plugin"
          done
          ls -lS portable/lib | head -40
          du -sh build/linux/x64/release/bundle portable
      # A tar keeps file modes and symlinks, which artifacts lose.
      - run: |
          tar -C build/linux/x64/release -cf bundle.tar bundle
          tar -cf portable.tar portable
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            bundle.tar
            portable.tar

  linux-packages:
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            packaging
            test/fixtures
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
      - run: tar -xf bundle.tar && tar -xf portable.tar
      - name: Install packaging tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y ruby-dev rpm xvfb
          sudo gem install --no-document fpm
      - run: bash packaging/linux/make-packages.sh "${TAG#v}" bundle portable dist

      # Started under a virtual display, the app must still run after 20 s.
      - name: Check that the packages install and start
        run: |
          # In its own D-Bus session (as a desktop has), so nothing the app
          # starts outlives the check and holds the step open.
          running() { local status=0; dbus-run-session -- xvfb-run -a timeout -k 10 20 "$@" || status=$?; [ "$status" = 124 ]; }
          # GL and Mesa drivers and sound: a desktop has them, the runner lacks them.
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y dbus-daemon libegl1 libgles2 libgl1 libegl-mesa0 libgl1-mesa-dri libgtk-3-0t64 libpulse0 libasound2t64 libpipewire-0.3-0t64
          # First the AppImage and the archive, with no libmpv on the
          # system: they must bring their own.
          chmod +x dist/*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          running dist/*.AppImage
          mkdir tar-check && tar -C tar-check -xJf dist/*.tar.xz && running tar-check/folder/folder
          # Its Tesseract reads text without one on the system.
          TESSDATA_PREFIX=tar-check/folder/tesseract/tessdata \
            tar-check/folder/tesseract/tesseract test/fixtures/ocr_invoice.png stdout | tee ocr.txt
          grep -q 'Invoice 2041' ocr.txt
          # Then the .deb, which installs the system's libmpv.
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends ./dist/*.deb
          running folder
          sudo apt-get remove -y folder
          rpm -qip dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error

  flatpak:
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
      - name: Install Flatpak tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y flatpak flatpak-builder xvfb
          # Ubuntu 24.04 stops the user namespaces flatpak-builder's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build the Flatpak
        run: |
          mkdir -p fp/input dist
          tar -xf portable.tar
          mv portable fp/input/bundle
          cp packaging/linux/flatpak/com.synqixlabs.folder.yml fp/
          cp packaging/linux/com.synqixlabs.folder.desktop packaging/linux/com.synqixlabs.folder.metainfo.xml fp/input/
          cp -a packaging/linux/icons fp/input/
          flatpak-builder --user --force-clean --repo=fp/repo fp/build fp/com.synqixlabs.folder.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            fp/repo "dist/folder-$TAG-linux-x86_64.flatpak" com.synqixlabs.folder
      - name: Check that it installs and starts
        run: |
          flatpak install --user -y --noninteractive "dist/folder-$TAG-linux-x86_64.flatpak"
          status=0; dbus-run-session -- xvfb-run -a timeout 30 flatpak run com.synqixlabs.folder || status=$?
          [ "$status" = 124 ]
      - uses: actions/upload-artifact@v4
        with:
          name: packages-flatpak
          path: dist/*
          if-no-files-found: error

  snap:
    needs: linux-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
      - name: Prepare the snap project
        run: |
          mkdir snap-project
          tar -C snap-project -xf bundle.tar
          cp -a packaging/linux/snap snap-project/snap
          cp packaging/linux/icons/hicolor/256x256/apps/com.synqixlabs.folder.png snap-project/snap/gui/folder.png
          sed -i "s/@VERSION@/${TAG#v}/" snap-project/snap/snapcraft.yaml
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: snap-project
      - name: Check that it installs
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap list folder
          mkdir dist
          mv "${{ steps.build.outputs.snap }}" "dist/folder-$TAG-linux-amd64.snap"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-snap
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows, linux-packages, flatpak, snap]
    if: github.event_name == 'release' || inputs.upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber
          # Earlier builds attached a zip; the installers replace it.
          gh release view "$TAG" --json assets -q '.assets[].name' | grep -- '-windows-x64\.zip$' |
            while read -r old; do gh release delete-asset "$TAG" "$old" -y; done
          # SHA256SUMS.txt: the APKs' lines, then every desktop package.
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir previous || true
          touch previous/SHA256SUMS.txt
          grep '\.apk$' previous/SHA256SUMS.txt > SHA256SUMS.txt || true
          (cd dist && sha256sum -- *) >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
