[global]
  server role = standalone server
  workgroup = TESTGROUP
  netbios name = SAMBATEST
  map to guest = Bad User
  server min protocol = SMB2_02
  server max protocol = SMB3_11
  server signing = mandatory
  disable netbios = yes
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1
  smb ports = 445
  vfs objects =

[public]
  path = /share/public
  read only = no
  guest ok = yes
  force user = tester

[data]
  path = /share/data
  read only = no
  valid users = tester

[secret]
  path = /share/secret
  read only = no
  valid users = tester
  smb encrypt = required

[hidden$]
  path = /share/data
  read only = yes
  valid users = tester
